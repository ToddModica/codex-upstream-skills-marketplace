name: Sync upstream sources

on:
  schedule:
    # GitHub Actions uses UTC; 17:47 UTC is 01:47 Asia/Shanghai on the following day.
    - cron: '47 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-sources-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Refresh source locks
        id: locks
        run: python scripts/update_sources.py || test $? -eq 2
      - name: Copy locked redistributable sources
        if: steps.locks.outcome == 'success'
        run: python scripts/sync_sources.py --remote
      - name: Bump affected plugin versions
        run: |
          changed="$(git diff --name-only)"
          plugins=""
          # Ponytail preserves the version shared by all of its upstream platform
          # manifests; locally maintained plugins use Marketplace patch versions.
          for plugin in research-toolkit writing-toolkit codex-utility-toolkit watermarks-remover no-negative-echo; do
            if echo "$changed" | grep -q "^plugins/$plugin/"; then plugins="$plugins $plugin"; fi
          done
          test -z "$plugins" || python scripts/bump_versions.py $plugins
      - name: Validate final manifests and Skills
        run: |
          python scripts/validate_catalog.py
          python tests/test_generate_sources.py
          node plugins/no-negative-echo/hooks/test-no-negative-echo.js
      - name: Commit validated changes
        run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources.json plugins
          git commit -m 'chore: sync upstream skill sources'
          git push
